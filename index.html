<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Machine Translation</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 300px; height: 100px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>English to French</h1>
        <form action="/translate" method="POST">
            <textarea name="text" placeholder="Enter English text here...">{{ original }}</textarea>
            <br>
            <button type="submit">Translate Now</button>
        </form>

        {% if translation %}
        <div class="result">
            <h3>Translation:</h3>
            <p>{{ translation }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
